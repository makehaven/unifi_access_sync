unifi_access_sync.settings:
  type: config_object
  label: 'UniFi Access Sync settings'
  mapping:
    sync_enabled:
      type: boolean
      label: 'Sync members to UniFi Access'
    api_host:
      type: string
      label: 'UniFi Access API host'
    api_path_prefix:
      type: string
      label: 'Developer API path prefix'
    api_token:
      type: string
      label: 'UniFi Access API token'
    verify_ssl:
      type: boolean
      label: 'Verify SSL certificates'
    door_term_id:
      type: integer
      label: 'Door taxonomy term ID'
    use_key_module:
      type: boolean
      label: 'Use Key module for API token'
    api_key_id:
      type: string
      label: 'Key ID from Key module'
    allow_delete:
      type: boolean
      label: 'Allow reconcile to delete UniFi users missing from Drupal'
    member_role:
      type: string
      label: 'Role a door-badged account must hold to be a current member'
    reactivate_emailed_records:
      type: boolean
      label: 'Reactivate switched-off console records that carry an email address'
